<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>AEGIS — Trocar Code</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0d0d0d; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #161616; border: 1px solid #222; border-radius: 12px; padding: 40px; max-width: 500px; width: 100%; }
    .logo { font-size: 18px; font-weight: 700; letter-spacing: 3px; color: #fff; margin-bottom: 24px; }
    .logo span { color: #f5a623; }
    h2 { font-size: 18px; margin-bottom: 8px; }
    p { font-size: 13px; color: #666; margin-bottom: 24px; line-height: 1.6; }
    label { font-size: 12px; color: #888; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    input, select { width: 100%; background: #111; border: 1px solid #333; border-radius: 6px; padding: 10px 12px; color: #e0e0e0; font-size: 14px; margin-bottom: 16px; }
    .btn { width: 100%; background: #f5a623; color: #000; font-weight: 700; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; margin-top: 8px; }
    .btn:hover { opacity: 0.85; }
    .flash { padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
    .flash.error { background: #3a1a1a; border: 1px solid #f44336; color: #ef9a9a; }
    .flash.success { background: #1a3a1a; border: 1px solid #4caf50; color: #81c784; }
    .back { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: #444; text-decoration: none; }
    .back:hover { color: #888; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">AE<span>G</span>IS</div>
  <h2>Trocar Code por Token</h2>
  <p>Cole o code capturado pelo callback e selecione a conta correspondente.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <label>Code MELI</label>
    <input type="text" name="code" placeholder="TG-xxxxxxxxxxxx" autofocus/>

    <label>Conta</label>
    <select name="account_name">
      {% for account in accounts %}
        <option value="{{ account.name }}">{{ account.name }}</option>
      {% endfor %}
    </select>

    <button type="submit" class="btn">Autorizar →</button>
  </form>

  <a href="/" class="back">← Voltar ao painel</a>
</div>
</body>
</html>
