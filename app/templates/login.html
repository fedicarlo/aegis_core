<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AEGIS — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #161616;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 40px;
      max-width: 360px;
      width: 100%;
    }

    .logo { font-size: 20px; font-weight: 700; letter-spacing: 3px; color: #fff; margin-bottom: 24px; text-align: center; }
    .logo span { color: #f5a623; }

    .flashes { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .flash { padding: 10px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; }
    .flash.error { background: #3a1a1a; border: 1px solid #f44336; color: #ef9a9a; }
    .flash.info  { background: #1a2a3a; border: 1px solid #2196f3; color: #90caf9; }
    .flash.success { background: #16281a; border: 1px solid #4caf50; color: #a5d6a7; }

    label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 8px; }

    input[type="password"], input[type="email"], input[type="text"] {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 16px;
    }
    input:focus { outline: none; border-color: #f5a623; }

    .modes { display: flex; gap: 8px; margin-bottom: 20px; }
    .modes label {
      flex: 1; text-align: center; margin: 0; padding: 8px 0;
      border: 1px solid #333; border-radius: 6px; cursor: pointer;
      font-size: 12px; letter-spacing: 1px; color: #888; background: #0d0d0d;
    }
    .modes input { display: none; }
    .modes input:checked + span { color: #f5a623; font-weight: 700; }
    .modes label:has(input:checked) { border-color: #f5a623; background: #1c1710; }

    button {
      width: 100%;
      background: #f5a623;
      color: #000;
      font-weight: 700;
      font-size: 13px;
      border: none;
      border-radius: 6px;
      padding: 11px;
      cursor: pointer;
    }
    button:hover { opacity: 0.85; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">AE<span>G</span>IS</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flashes">
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="next" value="{{ next }}">

      <div class="modes">
        <label><input type="radio" name="modo" value="admin" checked onchange="toggleMode()"><span>Admin</span></label>
        <label><input type="radio" name="modo" value="seller" onchange="toggleMode()"><span>Seller</span></label>
      </div>

      <div id="email-field" class="hidden">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="username">
      </div>

      <label for="password">Senha</label>
      <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>

      <button type="submit">Entrar</button>
    </form>
  </div>

  <script>
    function toggleMode() {
      var seller = document.querySelector('input[name="modo"]:checked').value === 'seller';
      var ef = document.getElementById('email-field');
      var email = document.getElementById('email');
      ef.classList.toggle('hidden', !seller);
      email.required = seller;
    }
    toggleMode();
  </script>

</body>
</html>
