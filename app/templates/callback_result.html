<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AEGIS — Autorização</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #161616;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .card.ok    { border-top: 3px solid #4caf50; }
    .card.error { border-top: 3px solid #f44336; }

    .icon { font-size: 40px; margin-bottom: 16px; }

    .logo { font-size: 18px; font-weight: 700; letter-spacing: 3px; color: #fff; margin-bottom: 24px; }
    .logo span { color: #f5a623; }

    .message { font-size: 15px; color: #ccc; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="card {{ 'ok' if ok else 'error' }}">
    <div class="logo">AE<span>G</span>IS</div>
    <div class="icon">{{ '✅' if ok else '⚠️' }}</div>
    <div class="message">{{ message }}</div>
  </div>

</body>
</html>
