<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AEGIS — Link de Autorização</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #161616;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 40px;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .logo { font-size: 18px; font-weight: 700; letter-spacing: 3px; color: #fff; margin-bottom: 32px; }
    .logo span { color: #f5a623; }

    h2 { font-size: 20px; margin-bottom: 8px; }

    p { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 28px; }

    .account { color: #f5a623; font-weight: 600; }

    .link-box {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 12px;
      color: #555;
      word-break: break-all;
      margin-bottom: 20px;
      text-align: left;
    }

    .btn-connect {
      display: inline-block;
      background: #f5a623;
      color: #000;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 15px;
      margin-bottom: 16px;
      transition: opacity 0.15s;
    }

    .btn-connect:hover { opacity: 0.85; }

    .btn-copy {
      display: block;
      background: #222;
      color: #aaa;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      margin: 0 auto 28px;
      transition: opacity 0.15s;
    }

    .btn-copy:hover { opacity: 0.8; }

    .back { font-size: 13px; color: #444; text-decoration: none; }
    .back:hover { color: #888; }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">AE<span>G</span>IS</div>

  <h2>Autorizar conta <span class="account">{{ account_name }}</span></h2>

  <p>
    Clique no botão abaixo para conectar essa conta ao sistema AEGIS.<br>
    Você será redirecionado ao Mercado Livre para confirmar o acesso.
  </p>

  <div class="link-box">{{ auth_url }}</div>

  <a href="{{ auth_url }}" class="btn-connect">Conectar ao Mercado Livre →</a>

  <button class="btn-copy" onclick="copyLink()">📋 Copiar link</button>

  <br>
  <a href="/" class="back">← Voltar ao painel</a>
</div>

<script>
  function copyLink() {
    navigator.clipboard.writeText("{{ auth_url }}").then(() => {
      const btn = document.querySelector('.btn-copy');
      btn.textContent = '✅ Copiado!';
      setTimeout(() => btn.textContent = '📋 Copiar link', 2000);
    });
  }
</script>

</body>
</html>
